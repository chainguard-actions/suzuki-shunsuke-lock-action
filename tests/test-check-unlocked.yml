name: Test check mode - key not locked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-key-check-unlocked
          key_prefix: "lock__test__"
          github_token: ${{ env.GITHUB_TOKEN }}
          repo_owner: test-owner
          repo_name: test-repo
          fail_if_locked: "false"

      - name: Assert step ran (check mode attempted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "locked output: ${{ steps.action.outputs.locked }}"
          echo "already_locked output: ${{ steps.action.outputs.already_locked }}"
          echo "result output: ${{ steps.action.outputs.result }}"
          # The action either succeeds (key not locked) or fails due to API unavailability
          # Under act, GitHub API calls may fail - we just verify the action ran
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: action did not produce a valid outcome"
            exit 1
          fi
