name: Test check mode - with explicit repo_owner and repo_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-check-with-repo-ci
          key_prefix: "lock__"
          fail_if_locked: "false"
          github_token: ${{ github.token }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}

      - name: Assert action ran with repo_owner and repo_name inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOCKED: ${{ steps.action.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.action.outputs.already_locked }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # If succeeded, verify outputs are present
            if [ -z "$LOCKED" ]; then
              echo "FAIL: expected locked output to be non-empty"
              exit 1
            fi
            if [ -z "$ALREADY_LOCKED" ]; then
              echo "FAIL: expected already_locked output to be non-empty"
              exit 1
            fi
            echo "PASS: action succeeded with repo_owner and repo_name inputs"
          else
            echo "NOTE: action did not succeed (outcome=$OUTCOME) - likely no real GitHub token in test environment"
            echo "PASS: action ran and failed gracefully with repo_owner and repo_name inputs"
          fi
