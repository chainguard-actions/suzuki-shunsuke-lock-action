name: Test unlock mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to unlock a key (remove key when unlocking)
        id: unlock
        uses: .
        with:
          mode: unlock
          key: test-unlock-mode-key
          remove_key_when_unlock: "true"
          message: "Test unlock from act workflow"
          github_token: ${{ env.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert outputs on success
        env:
          LOCKED: ${{ steps.unlock.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.unlock.outputs.already_locked }}
          RESULT: ${{ steps.unlock.outputs.result }}
        run: |
          echo "outcome: ${{ steps.unlock.outcome }}"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          echo "result: $RESULT"
          if [ "${{ steps.unlock.outcome }}" = "success" ]; then
            # On success, locked should be false after unlock
            if [ "$LOCKED" != "false" ]; then
              echo "FAIL: locked output should be 'false' after unlock, got: $LOCKED"
              exit 1
            fi
            echo "PASS: unlock outputs are valid"
          else
            echo "SKIP: action did not succeed (likely no real GitHub token in act environment)"
          fi
