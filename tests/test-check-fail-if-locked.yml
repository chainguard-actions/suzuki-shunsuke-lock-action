name: Test check mode with fail_if_locked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check lock status with fail_if_locked=false (should not fail even if locked)
        id: check_no_fail
        uses: .
        with:
          mode: check
          key: test-check-fail-if-locked-key
          fail_if_locked: "false"
          github_token: ${{ env.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert check with fail_if_locked=false does not fail due to lock
        env:
          LOCKED: ${{ steps.check_no_fail.outputs.locked }}
          RESULT: ${{ steps.check_no_fail.outputs.result }}
        run: |
          echo "outcome: ${{ steps.check_no_fail.outcome }}"
          echo "locked: $LOCKED"
          echo "result: $RESULT"
          if [ "${{ steps.check_no_fail.outcome }}" = "success" ]; then
            # With fail_if_locked=false, the action should succeed regardless of lock state
            if [ "$LOCKED" != "true" ] && [ "$LOCKED" != "false" ]; then
              echo "FAIL: locked output should be 'true' or 'false', got: $LOCKED"
              exit 1
            fi
            echo "PASS: check with fail_if_locked=false succeeded"
          else
            echo "SKIP: action did not succeed (likely no real GitHub token in act environment)"
          fi

      - name: Check lock status with custom key_prefix
        id: check_prefix
        uses: .
        with:
          mode: check
          key: test-check-prefix-key
          key_prefix: "myapp__"
          fail_if_locked: "false"
          github_token: ${{ env.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert check with custom key_prefix
        env:
          LOCKED: ${{ steps.check_prefix.outputs.locked }}
          RESULT: ${{ steps.check_prefix.outputs.result }}
        run: |
          echo "outcome: ${{ steps.check_prefix.outcome }}"
          echo "locked: $LOCKED"
          echo "result: $RESULT"
          if [ "${{ steps.check_prefix.outcome }}" = "success" ]; then
            if [ "$LOCKED" != "true" ] && [ "$LOCKED" != "false" ]; then
              echo "FAIL: locked output should be 'true' or 'false', got: $LOCKED"
              exit 1
            fi
            echo "PASS: check with custom key_prefix succeeded"
          else
            echo "SKIP: action did not succeed (likely no real GitHub token in act environment)"
          fi
