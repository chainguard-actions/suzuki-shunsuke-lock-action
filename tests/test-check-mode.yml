name: Test check mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-service-prod
          key_prefix: "lock__"
          fail_if_locked: "false"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOCKED: ${{ steps.action.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.action.outputs.already_locked }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$LOCKED" ]; then
              echo "FAIL: action succeeded but 'locked' output is empty"
              exit 1
            fi
            echo "PASS: locked='$LOCKED' already_locked='$ALREADY_LOCKED' result='$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
