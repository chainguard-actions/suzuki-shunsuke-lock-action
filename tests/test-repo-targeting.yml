name: Test repo_owner and repo_name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-repo-targeting
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}
          github_token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOCKED: ${{ steps.action.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.action.outputs.already_locked }}
        run: |
          echo "outcome: $OUTCOME"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$LOCKED" ] && [ -z "$ALREADY_LOCKED" ]; then
              echo "FAIL: action succeeded but outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with locked=$LOCKED already_locked=$ALREADY_LOCKED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
