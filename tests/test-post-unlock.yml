name: Test post_unlock mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lock with post_unlock enabled (lock released in post step)
        id: lock
        uses: .
        with:
          mode: lock
          key: test-post-unlock-key
          post_unlock: "true"
          ignore_already_locked_error: "true"
          message: "Test post_unlock from act workflow"
          github_token: ${{ env.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert outputs on success
        env:
          LOCKED: ${{ steps.lock.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.lock.outputs.already_locked }}
          RESULT: ${{ steps.lock.outputs.result }}
        run: |
          echo "outcome: ${{ steps.lock.outcome }}"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          echo "result: $RESULT"
          if [ "${{ steps.lock.outcome }}" = "success" ]; then
            if [ "$LOCKED" != "true" ] && [ "$LOCKED" != "false" ]; then
              echo "FAIL: locked output should be 'true' or 'false', got: $LOCKED"
              exit 1
            fi
            if [ "$ALREADY_LOCKED" != "true" ] && [ "$ALREADY_LOCKED" != "false" ]; then
              echo "FAIL: already_locked output should be 'true' or 'false', got: $ALREADY_LOCKED"
              exit 1
            fi
            echo "PASS: post_unlock lock outputs are valid"
          else
            echo "SKIP: action did not succeed (likely no real GitHub token in act environment)"
          fi
