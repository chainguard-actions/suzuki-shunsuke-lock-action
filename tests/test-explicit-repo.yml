name: Test explicit repo_owner and repo_name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-explicit-repo-key
          repo_owner: some-owner
          repo_name: some-repo
          github_token: dummy-token
      - name: Assert repo_owner and repo_name inputs were accepted
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "locked output: ${{ steps.action.outputs.locked }}"
          echo "already_locked output: ${{ steps.action.outputs.already_locked }}"
          # The action may fail due to invalid token/repo, but we just need to verify
          # that the inputs repo_owner and repo_name are accepted by the action schema.
          # A failure due to API error (not input validation) is acceptable here.
          # We check that the outcome is either success or failure (not skipped),
          # meaning the action ran with the provided inputs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with repo_owner and repo_name inputs"
