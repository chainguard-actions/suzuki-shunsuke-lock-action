name: Test check mode - fail_if_locked false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: check
          key: test-check-fail-if-locked-false-ci
          key_prefix: "lock__"
          fail_if_locked: "false"
          github_token: ${{ github.token }}

      - name: Assert action ran (check mode with fail_if_locked=false)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LOCKED: ${{ steps.action.outputs.locked }}
          ALREADY_LOCKED: ${{ steps.action.outputs.already_locked }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "locked: $LOCKED"
          echo "already_locked: $ALREADY_LOCKED"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # For check mode, locked and already_locked should be equal
            if [ "$LOCKED" != "$ALREADY_LOCKED" ]; then
              echo "FAIL: for check mode, locked and already_locked should be equal"
              echo "  locked=$LOCKED, already_locked=$ALREADY_LOCKED"
              exit 1
            fi
            if [ -z "$RESULT" ]; then
              echo "FAIL: result should not be empty"
              exit 1
            fi
            echo "PASS: action succeeded with correct outputs"
          else
            echo "NOTE: action did not succeed (outcome=$OUTCOME) - likely no real GitHub token in test environment"
            echo "PASS: action ran and failed gracefully"
          fi
