name: Test repo_owner and repo_name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check lock with explicit repo_owner and repo_name
        id: check
        uses: .
        with:
          mode: check
          key: test-repo-owner-name-key
          fail_if_locked: "false"
          github_token: ${{ env.GITHUB_TOKEN }}
          repo_owner: ${{ github.repository_owner }}
          repo_name: ${{ github.event.repository.name }}
        continue-on-error: true

      - name: Assert action ran with repo_owner and repo_name inputs
        env:
          OUTCOME: ${{ steps.check.outcome }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: result output should be set on success"
              exit 1
            fi
            echo "PASS: action succeeded with repo_owner and repo_name inputs (result=$RESULT)"
          else
            echo "SKIP: action did not succeed (likely no real GitHub token in act environment)"
            echo "PASS: inputs repo_owner and repo_name were accepted by the action"
          fi
